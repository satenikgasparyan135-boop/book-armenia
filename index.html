<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Armenia</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f1e6; font-family: Georgia, serif; color: #4a4a4a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { margin-top: 25px; display: flex; gap: 25px; font-size: 1rem; font-weight: 600; }
        .header a { text-decoration: none; color: #4a4a4a; }
        .main-title { margin-top: 25px; font-size: 2.5rem; font-weight: 700; text-align: center; }
        .sub-title { margin-top: 5px; font-size: 1rem; text-align: center; margin-bottom: 20px; }
        .bookshelf-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .shelf-row { width: 90%; display: flex; flex-direction: column; align-items: center; }
        .books-row { display: flex; justify-content: center; align-items: flex-end; gap: 2px; height: 65px; width: 100%; }
        .book { width: 9px; border-radius: 2px; }
        .shelf { width: 100%; height: 10px; background-color: #b08f6f; border-radius: 4px; }
        .h-1 { height: 60px; background-color: #d97a5f; }
        .h-2 { height: 52px; background-color: #c59164; }
        .h-3 { height: 57px; background-color: #e0ab7a; }
        .h-4 { height: 65px; background-color: #648c99; }
        .h-5 { height: 55px; background-color: #bda370; }
        .h-6 { height: 58px; background-color: #709987; }
        .about-section { width: 85%; max-width: 500px; margin: 25px 0 30px 0; text-align: center; background-color: #faf8f2; padding: 20px; border-radius: 10px; border: 1px solid #e6e2d3; }
        .about-section h2 { font-size: 1.5rem; margin-bottom: 10px; }
        .about-section p { font-size: 0.95rem; line-height: 1.5; }
        .footer { margin-top: auto; margin-bottom: 25px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="header">
        <a href="about.html">Մեր մասին</a>
        <a href="#">Կապ</a>
    </div>
    <div class="main-title">Book Armenia</div>
    <div class="sub-title">Բարի գալուստ գրքերի աշխարհ</div>
    <div class="bookshelf-container">
        <div class="shelf-row">
            <div class="books-row">
                <div class="book h-1"></div><div class="book h-2"></div><div class="book h-3"></div><div class="book h-4"></div><div class="book h-1"></div><div class="book h-5"></div><div class="book h-2"></div><div class="book h-6"></div><div class="book h-3"></div><div class="book h-5"></div><div class="book h-4"></div><div class="book h-1"></div><div class="book h-5"></div><div class="book h-2"></div>
            </div>
            <div class="shelf"></div>
        </div>
        <div class="shelf-row">
            <div class="books-row">
                <div class="book h-1"></div><div class="book h-2"></div><div class="book h-3"></div><div style="width: 35px; height: 9px; background-color: #648c99; border-radius: 2px; margin-bottom: 2px;"></div><div class="book h-3"></div><div class="book h-5"></div><div class="book h-4"></div><div class="book h-1"></div><div class="book h-5"></div><div class="book h-2"></div><div class="book h-3"></div><div class="book h-6"></div>
            </div>
            <div class="shelf"></div>
        </div>
    </div>
    <div class="footer">© 2026 Book Armenia</div>
</body>
</html>
