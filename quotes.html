<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Մեջբերումներ - Book Armenia</title>
    <style>
        body {
            margin: 0; padding: 20px;
            background: linear-gradient(135deg, #fdfcf6 0%, #e8e4d1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #333; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; line-height: 1.8;
        }

        .geek-img {
            width: 100%; max-width: 450px; height: auto;
            margin-bottom: 30px; margin-top: 20px;
            filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.15));
        }

        .article {
            background-color: #fff; padding: 40px;
            border-radius: 16px; border: 2px solid #dcd8c5;
            max-width: 650px; margin: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #6a4c93; font-size: 2.8rem;
            margin-top: 0; margin-bottom: 20px; font-weight: 800;
            text-shadow: 1px 1px #fff, 2px 2px #999;
        }

        .quote {
            font-size: 1.5rem; font-style: italic;
            margin: 30px 0; padding: 20px;
            border-top: 2px solid #6a4c93;
            border-bottom: 2px solid #6a4c93;
            color: #444;
        }

        .author-name {
            font-size: 1.1rem; font-weight: bold; color: #6a4c93;
        }

        .footer-link {
            margin-top: 40px; font-size: 1.1rem; font-weight: 600;
            color: #666; text-decoration: none; padding: 10px;
        }
        .footer-link:hover { color: #333; text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Գիքային գրադարակի պատկեր -->
    <svg class="geek-img" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="600" height="200" fill="none"/>
        <rect x="50" y="140" width="500" height="15" fill="#6a4c93" rx="5"/>
        <rect x="100" y="70" width="400" height="15" fill="#6a4c93" rx="5"/>
        <rect x="70" y="80" width="30" height="60" fill="#ffcdb2" rx="3"/>
        <rect x="110" y="90" width="25" height="50" fill="#ffb4a2" rx="3"/>
        <rect x="145" y="70" width="35" height="70" fill="#e5989b" rx="3"/>
        <circle cx="280" cy="110" r="25" fill="#6a4c93"/>
        <rect x="270" y="120" width="20" height="15" fill="#fff" rx="2"/>
        <circle cx="270" cy="100" r="5" fill="#b5838d"/>
        <circle cx="290" cy="100" r="5" fill="#b5838d"/>
        <rect x="320" y="60" width="30" height="80" fill="#6a4c93" rx="3"/>
        <rect x="360" y="75" width="25" height="65" fill="#e5989b" rx="3"/>
        <polygon points="460,60 445,90 475,90" fill="#ffb4a2"/>
        <rect x="445" y="90" width="30" height="50" fill="#ffb4a2" rx="3"/>
    </svg>

    <div class="article">
        <h1>✨ Մեջբերումներ</h1>
        
        <div class="quote">
            «Գիրք կարդալը նման է ճամփորդության առանց տնից դուրս գալու»։
            <div class="author-name">— Անհայտ հեղինակ</div>
        </div>

        <div class="quote">
            «Այնքան շատ գրքեր կան կարդալու, և այնքան քիչ ժամանակ»։
            <div class="author-name">— Ֆրենկ Զապա</div>
        </div>
    </div>
    
    <a href="index.html" class="footer-link">← Վերադառնալ գլխավոր էջ</a>
</body>
</html>
