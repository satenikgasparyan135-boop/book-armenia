<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Նորություններ - Book Armenia</title>
    <style>
        body {
            margin: 0; padding: 20px;
            background: linear-gradient(135deg, #fdfcf6 0%, #e8e4d1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Ժամանակակից տառատեսակ */
            color: #333; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; line-height: 1.8; /* Ավելի մեծ տողերի միջև հեռավորություն */
        }

        /* Ուրախ գիքային SVG պատկեր */
        .geek-img {
            width: 100%; max-width: 450px; height: auto;
            margin-bottom: 30px; margin-top: 20px;
            filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.15));
        }

        .article {
            background-color: #fff; padding: 40px;
            border-radius: 16px; border: 2px solid #dcd8c5;
            max-width: 650px; margin: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); /* Փափագ ստվեր */
            text-align: left; /* Տեքստը ձախից */
        }

        h1 {
            color: #b08f6f; font-size: 2.8rem; /* Հսկա վերնագիր */
            margin-top: 0; margin-bottom: 20px; font-weight: 800;
            text-shadow: 1px 1px #fff, 2px 2px #999; /* 3D էֆեկտ */
        }

        p { font-size: 1.3rem; margin-bottom: 15px; } /* Մեծ տեքստ */

        .read-more {
            background-color: #e07a5f; color: #fff; padding: 12px 25px;
            border-radius: 50px; font-weight: 700; font-size: 1.1rem;
            text-decoration: none; transition: background 0.3s;
        }
        .read-more:hover { background-color: #d1694f; }

        .footer-link {
            margin-top: 40px; font-size: 1.1rem; font-weight: 600;
            color: #666; text-decoration: none; padding: 10px;
        }
        .footer-link:hover { color: #333; text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Գիքային գրադարակի պատկեր -->
    <svg class="geek-img" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="600" height="200" fill="none"/>
        <!-- Գրադարակներ -->
        <rect x="50" y="140" width="500" height="15" fill="#967454" rx="5"/>
        <rect x="100" y="70" width="400" height="15" fill="#967454" rx="5"/>
        <!-- Գրքեր -->
        <rect x="70" y="80" width="30" height="60" fill="#e07a5f" rx="3"/>
        <rect x="110" y="90" width="25" height="50" fill="#3d405b" rx="3"/>
        <rect x="145" y="70" width="35" height="70" fill="#81b29a" rx="3"/>
        <rect x="190" y="100" width="20" height="40" fill="#f4a261" rx="3"/>
        <rect x="220" y="85" width="30" height="55" fill="#e76f51" rx="3"/>
        <!-- Գիքային տարրեր -->
        <circle cx="280" y="110" r="25" fill="#e9c46a"/> <!-- Ռոբոտի գլուխ -->
        <rect x="270" y="120" width="20" height="15" fill="#999" rx="2"/> <!-- Բերան -->
        <circle cx="270" y="100" r="5" fill="#333"/> <!-- Աչք -->
        <circle cx="290" y="100" r="5" fill="#333"/> <!-- Աչք -->
        <rect x="320" y="60" width="30" height="80" fill="#2a9d8f" rx="3"/>
        <rect x="360" y="75" width="25" height="65" fill="#e9c46a" rx="3"/>
        <rect x="400" y="65" width="35" height="75" fill="#e76f51" rx="3"/>
        <polygon points="460,60 445,90 475,90" fill="#457b9d"/> <!-- Կախարդական գլխարկ -->
        <rect x="445" y="90" width="30" height="50" fill="#457b9d" rx="3"/>
        <rect x="490" y="100" width="30" height="40" fill="#a8dadc" rx="3"/>
    </svg>

    <div class="article">
        <h1>📰 Նորություններ</h1>
        <p>Ինչու՞ են ժամանակակից գրքերն օգնում գտնել ներքին հանգստություն։ Օրական ընդամենը 20 րոպե ընթերցելը նվազեցնում է սթրեսի մակարդակը և օգնում է լիցքաթափվել։ Սա գիտականորեն ապացուցված է։</p>
        <p>Միացե՛ք մեզ՝ բացահայտելու ավելին։</p>
        <br>
        <a href="#" class="read-more">Կարդալ ամբողջը</a>
    </div>
    <br>
    <a href="index.html" class="footer-link">← Վերադառնալ գլխավոր էջ</a>
</body>
</html>
